name: Build CentOS Agents (Manual Only)
on:
  workflow_dispatch:
    inputs:
      container_tag:
        description: 'Legacy image tag for this upgrade build (for example v0.7.1-legacy)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Derived legacy images use the CentOS base latest aliases; serialize rebuilds.
concurrency:
  group: centos-agents-manual
  cancel-in-progress: false

jobs:
  validate-inputs:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate image tag
        env:
          CONTAINER_TAG: ${{ inputs.container_tag }}
        run: |
          if [[ ! "$CONTAINER_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ || "$CONTAINER_TAG" == latest ]]; then
            echo "Provide a valid image tag other than latest."
            exit 1
          fi
  build-centos-base-amd:
    needs: [validate-inputs]
    uses: ./.github/workflows/build_agent_image_amd.yaml
    secrets: inherit
    with:
      container_tag: ${{ inputs.container_tag }}
      build_agent_base: true
      base_os: centos
  build-centos-base-arm:
    needs: [validate-inputs]
    uses: ./.github/workflows/build_agent_image_arm.yaml
    secrets: inherit
    with:
      container_tag: ${{ inputs.container_tag }}
      build_agent_base: true
      base_os: centos
  push-centos-base-manifest:
    needs: [build-centos-base-amd, build-centos-base-arm]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        runtime: [docker, podman]
    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish CentOS base manifests
        env:
          CONTAINER_TAG: ${{ inputs.container_tag }}
          REGISTRY_REPO: ghcr.io/${{ github.repository_owner }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          runtime_suffix=""
          if [[ "$RUNTIME" == podman ]]; then
            runtime_suffix="-podman"
          fi
          for tag in "$CONTAINER_TAG" latest; do
            image="${REGISTRY_REPO}/jenkins-agent-base:${tag}${runtime_suffix}"
            docker manifest create "$image" "${image}-amd64" "${image}-arm64"
            docker manifest push "$image"
            skopeo copy -f oci --multi-arch all --retry-times 3 "docker://${image}" "docker://${image}"
          done
  build-agent-nodejs-amd:
    needs: [push-centos-base-manifest]
    strategy:
      matrix:
        runtime: [ docker, podman ]
        version: [ "16.20.2"]
    runs-on: ubuntu-24.04
    env:
      os: centos
      arch_suffix: "-amd64"
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: init variables
        id: step-variable
        run: |
          export "runtime=$([ ${{ matrix.runtime }} == podman ] && (echo -podman))"
          echo "runtime=${runtime}" >> $GITHUB_OUTPUT
          export "nodejsVersion=$( echo -${{ matrix.version }})"
          echo "suffix=${nodejsVersion}${runtime}" >> $GITHUB_OUTPUT
      - name: use setup-buildx-action
        uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build jenkins agent with nodejs
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./jenkins-agent/nodejs/Dockerfile
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/jenkins-agent-nodejs:${{ inputs.container_tag }}${{ steps.step-variable.outputs.suffix }}${{ env.arch_suffix }}
            ghcr.io/${{ github.repository_owner }}/jenkins-agent-nodejs:latest${{ steps.step-variable.outputs.suffix }}${{ env.arch_suffix }}
          build-args: |
            REGISTRY_REPO=ghcr.io/${{ github.repository_owner }}
            RUNTIME=${{ steps.step-variable.outputs.runtime }}
            VERSION=${{ matrix.version }}
            DISTRIBUTION=${{ env.os }}
            ARCH_SUFFIX=${{ env.arch_suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-agent-nodejs-arm:
    needs: [push-centos-base-manifest]
    strategy:
      matrix:
        runtime: [ docker, podman ]
        version: [ "16.20.2" ]
    runs-on: ubuntu-24.04-arm
    env:
      os: centos
      arch_suffix: "-arm64"
    steps:
      - name: checkout
