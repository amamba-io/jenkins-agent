- name: Install Podman
  shell: |
    set -eu
    ARCH=$(uname -m)
    if [[ ${ARCH} == 'x86_64' ]]; then
      curl -fL -o /etc/yum.repos.d/home:alvistack.repo https://download.opensuse.org/repositories/home:alvistack/CentOS_7/home:alvistack.repo
    elif [[ ${ARCH} == 'aarch64' ]]; then
      curl -fL -o /etc/yum.repos.d/devel:kubic:libcontainers:stable.repo https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/stable/CentOS_7/devel:kubic:libcontainers:stable.repo
    else
      echo "Unsupported Podman architecture: ${ARCH}" >&2
      exit 1
    fi
    yum -y --setopt=skip_missing_names_on_install=False install podman fuse-overlayfs
    rm -rf /usr/bin/docker
    rm -rf /usr/local/bin/docker
    ln -s /usr/bin/podman /usr/bin/docker
    yum -y clean all --enablerepo='*'
  when: install_podman is defined and install_podman | bool
  retries: 3
  delay: 5

- name: Validate podman installation
  shell: |
    set -eu
    podman --version
    docker --version
    /usr/local/libexec/podman/netavark --version
    /usr/local/libexec/podman/aardvark-dns --version
    test -L /usr/bin/docker
  when: install_podman is defined and install_podman | bool
  changed_when: false
